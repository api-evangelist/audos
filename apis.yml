aid: audos
name: Audos
description: 'Audos is a New York-based AI-native startup studio and "publishing house for everyday
  entrepreneurs," founded in 2024 by Henrik Werdelin and Nicholas Thorne (the team behind Prehype, BarkBox,
  Ro, and Managed by Q). It helps non-technical solo founders turn expertise into million-dollar AI
  businesses, giving them AI-powered business-building tools, up to $25,000 in funding, and paid-social
  distribution in exchange for a ~15% revenue share, aiming to launch startups at massive scale. Audos
  raised an $11.5M seed round led by True Ventures (with backing from Niklas Zennstrom) and acquired No Cap.
  Its product surface is a consumer/entrepreneur web platform; the api.audos.com backend is private and
  auth-gated, with no public developer API, documentation, or SDKs at this time.'
